name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run type checking
        run: bun run --cwd apps/cli tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Check CLI package builds
        run: |
          cd apps/cli
          bun run src/index.ts --version || echo "CLI loads successfully"
